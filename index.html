<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>redax — get your pics ready to share</title>
  <meta name="description" content="Hide what you want in a photo, then save. Your pictures stay on this device." />
  <meta name="keywords" content="redax, blur, redact, image, privacy, metadata, screenshot, browser tool" />
  <meta name="author" content="typicalfo" />
  <meta name="theme-color" content="#F4F6F8" />
  <link rel="canonical" href="https://github.com/typicalfo/redax" />
  <script>
    (function () {
      var theme = 'light';
      try {
        var stored = localStorage.getItem('redax-theme');
        if (stored === 'light' || stored === 'dark') theme = stored;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#2A2825' : '#F4F6F8');
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="redax — get your pics ready to share" />
  <meta property="og:description" content="Hide what you want in a photo, then save. Your pictures stay on this device." />
  <meta property="og:url" content="https://github.com/typicalfo/redax" />
  <meta property="og:site_name" content="redax" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="redax — get your pics ready to share" />
  <meta name="twitter:description" content="Hide what you want in a photo, then save. Your pictures stay on this device." />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
